<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חוקי התנ"ך - ויקרא י"ט - משחק אימרסיבי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            user-select: none;
            overflow: hidden;
        }
        /* קיר בעל זהות ויזואלית ייחודית מתוך משפחת העיצוב (Teal & Gold Theme) */
        .bg-immersive-wall {
            background-color: #04151f;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(20, 184, 166, 0.15) 0%, transparent 60%),
                radial-gradient(#0f3846 2px, transparent 2px);
            background-size: 100% 100%, 36px 36px;
        }
        
        /* תנועה גלית דינמית לכרטיסי התשובות */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1.5deg); }
        }
        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(20px) rotate(-1.5deg); }
        }

        .float-card-1 { animation: floatSlow 3.2s ease-in-out infinite; }
        .float-card-2 { animation: floatReverse 3.8s ease-in-out infinite; }
        .float-card-3 { animation: floatSlow 4.2s ease-in-out infinite; }
        .float-card-4 { animation: floatReverse 3.5s ease-in-out infinite; }

        .touch-card {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, border-color 0.2s;
        }
        .touch-card:active {
            transform: scale(0.94) !important;
        }
        .glow-border {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
        }

        /* חלקיקי קונפטי */
        .confetti-piece {
            position: absolute;
            width: 14px;
            height: 24px;
            top: -30px;
            opacity: 0.9;
            animation: fall 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body class="bg-immersive-wall min-h-screen text-white flex flex-col justify-between p-8 relative">

    <!-- Header / Progress Bar -->
    <header class="flex justify-between items-center border-b-2 border-teal-800/60 pb-4">
        <div class="flex items-center space-x-4 space-x-reverse">
            <span class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black text-2xl px-5 py-2 rounded-2xl shadow-xl border border-amber-300/40">
                ספר ויקרא • פרק י"ט
            </span>
            <span id="question-tracker" class="text-2xl text-teal-200 font-bold tracking-wide">
                שאלה 1 מתוך 6
            </span>
        </div>
        
        <!-- מד ניקוד חגיגי -->
        <div class="flex items-center gap-3 bg-slate-900/90 border border-amber-400/50 px-6 py-2 rounded-2xl shadow-lg">
            <span class="text-3xl">⭐</span>
            <span class="text-xl text-amber-200 font-bold">ניקוד:</span>
            <span id="score-display" class="text-3xl font-black text-amber-400">0</span>
        </div>

        <div class="text-3xl font-black text-amber-400 tracking-wider flex items-center gap-2">
            <span>✨</span>
            <span>מהו הערך המשותף?</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col justify-center items-center my-4 max-w-6xl mx-auto w-full">
        
        <!-- Verses Container -->
        <div class="w-full bg-slate-900/85 border-4 border-amber-500/60 rounded-3xl p-8 mb-6 shadow-2xl backdrop-blur-md glow-border">
            <h2 class="text-2xl text-teal-300 font-bold mb-4 text-center tracking-wide">החוקים מתוך התורה:</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-center">
                <div class="bg-slate-950/80 p-6 rounded-2xl border-2 border-teal-700/50 flex items-center justify-center">
                    <p id="verse-1" class="text-3xl md:text-4xl font-extrabold text-amber-100 leading-relaxed"></p>
                </div>
                <div class="bg-slate-950/80 p-6 rounded-2xl border-2 border-teal-700/50 flex items-center justify-center">
                    <p id="verse-2" class="text-3xl md:text-4xl font-extrabold text-amber-100 leading-relaxed"></p>
                </div>
            </div>
        </div>

        <!-- Question Prompt -->
        <div class="text-center mb-6">
            <h3 class="text-3xl md:text-4xl font-black text-white drop-shadow-lg">
                מהו הערך המשותף לשני החוקים האלה?
            </h3>
        </div>

        <!-- Answer Options (2x2 Grid for Easy Wall Touching) -->
        <div id="options-container" class="grid grid-cols-2 gap-6 w-full max-w-5xl">
            <!-- Options dynamically rendered here -->
        </div>

    </main>

    <!-- קונטיינר לקונפטי -->
    <div id="confetti-container" class="fixed inset-0 pointer-events-none z-40 overflow-hidden"></div>

    <!-- Feedback Overlay -->
    <div id="feedback-overlay" class="hidden fixed inset-0 bg-slate-950/95 flex-col items-center justify-center z-50 p-8 text-center backdrop-blur-md">
        <div id="feedback-icon" class="text-9xl mb-4">✨</div>
        <h2 id="feedback-title" class="text-6xl font-black mb-6">כל הכבוד!</h2>
        <p id="feedback-desc" class="text-3xl text-slate-200 max-w-3xl leading-relaxed mb-10 font-medium"></p>
        <div class="flex gap-6">
            <button id="retry-btn" onclick="retryQuestion()" class="hidden bg-slate-800 hover:bg-slate-700 text-amber-300 text-3xl font-black px-12 py-6 rounded-2xl shadow-2xl transition active:scale-95 border border-amber-500/40">
                נסו שוב 🔄
            </button>
            <button id="next-btn" onclick="nextQuestion()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 text-3xl font-black px-14 py-6 rounded-2xl shadow-2xl transition active:scale-95 border border-amber-200">
                לשאלה הבאה ➔
            </button>
        </div>
    </div>

    <!-- Game Completion Screen -->
    <div id="complete-screen" class="hidden fixed inset-0 bg-slate-950 flex-col items-center justify-center z-50 p-8 text-center">
        <div class="text-9xl mb-6">📜</div>
        <h2 class="text-6xl font-black text-amber-400 mb-6">אלופים! סיימתם את הקיר!</h2>
        <p class="text-3xl text-slate-300 max-w-3xl mb-10 leading-relaxed font-medium">
            גיליתם והבנתם את הערכים המוסריים המרכזיים בפרק י"ט בספר ויקרא: יושר, אחריות לזולת, כבוד לקשישים, הוגנות במשפט ובמסחר והגנה על החלש!
        </p>
        <button onclick="restartGame()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-3xl font-black px-12 py-6 rounded-2xl shadow-2xl transition active:scale-95">
            משחק חדש 🔄
        </button>
    </div>

    <script>
        // כל השאלות והחוקים מבוססים מובהקת על ספר ויקרא פרק י"ט
        const questions = [
            {
                // ויקרא י"ט - תוקן ל-"לֹא תִגְנֹב" בדיוק
                verse1: `"לֹא תִגְנֹב"`,
                verse2: `"וְלֹא תְכַחֲשׁוּ וְלֹא תְשַׁקְרוּ אִישׁ בַּעֲמִיתוֹ"`,
                options: [
                    { text: "אזהרה מפני אנשים זרים", correct: false },
                    { text: "סבלנות ואיפוק", correct: false },
                    { text: "יושר ואמינות בין אדם לחברו", correct: true },
                    { text: "שמירה על ניקיון המרחב", correct: false }
                ],
                explanation: "חוקים אלו מוויקרא י\"ט דורשים מאיתנו לנהוג ביושר מוחלט, ללא רמאות או גנבה."
            },
            {
                // ויקרא י"ט, ט'-י'
                verse1: `"וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם לֹא תְכַלֶּה פְּאַת שָׂדְךָ"`,
                verse2: `"וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט... לֶעָנִי וְלַגֵּר תַּעֲזֹב אֹתָם"`,
                options: [
                    { text: "דאגה לנזקקים ונתינה לחלש", correct: true },
                    { text: "זהירות בעבודה בשדה", correct: false },
                    { text: "שמירת חוקי המדינה", correct: false },
                    { text: "כבוד למורים והורים", correct: false }
                ],
                explanation: "חוק פאת השדה והלקט מחייב אותנו לערבות הדדית ולדאוג למזונם של העניים והגרים."
            },
            {
                // ויקרא י"ט, ט"ז
                verse1: `"לֹא תֵלֵךְ רָכִיל בְּעַמֶּיךָ"`,
                verse2: `"לֹא תַעֲמֹד עַל דַּם רֵעֶךָ"`,
                options: [
                    { text: "התעלמות מקשיים של אחרים", correct: false },
                    { text: "אחריות ועזרה לזולת", correct: true },
                    { text: "שמירת סוד בלבד", correct: false },
                    { text: "סבלנות בשעת כעס", correct: false }
                ],
                explanation: "החוקים מורים לנו לא לפגוע בשמו של האחר ולא לעמוד מהצד כשאחר נמצא בצרה."
            },
            {
                // ויקרא י"ט, י"ד
                verse1: `"לֹא תְקַלֵּל חֵרֵשׁ"`,
                verse2: `"וְלִפְנֵי עִוֵּר לֹא תִתֵּן מִכְשׁוֹל"`,
                options: [
                    { text: "הגנה על חלשים ואי-ניצול מוגבלות של האחר", correct: true },
                    { text: "חובה ללמוד עזרה ראשונה", correct: false },
                    { text: "שמירה על ניקיון המרחב הציבורי", correct: false },
                    { text: "זהירות בדרכים", correct: false }
                ],
                explanation: "חוק זה אוסר לנצל מוגבלות או חולשה של אדם ומחייב אותנו לשמור על כבודו של כל אדם."
            },
            {
                // ויקרא י"ט, ל"ב
                verse1: `"מִפְּנֵי שֵׂיבָה תָּקוּם"`,
                verse2: `"וְהָדַרְתָּ פְּנֵי זָקֵן"`,
                options: [
                    { text: "כבוד, הערכה ודרך ארץ למבוגרים ולזקנים", correct: true },
                    { text: "חובת היציאה לטיולים בטבע", correct: false },
                    { text: "זהירות מפני מכשולים ברחוב", correct: false },
                    { text: "שמירה על שקט בשעות הלילה", correct: false }
                ],
                explanation: "חוקים אלו מורים לנו לחלוק כבוד ניכר לאנשים מבוגרים, לקום בפניהם ולהתנהג אליהם בדרך ארץ."
            },
            {
                // ויקרא י"ט, ט"ו - הושלם הציטוט לפי בקשתך
                verse1: `"לֹא תַעֲשׂוּ עָוֶל בַּמִּשְׁפָּט, לֹא תִשָּׂא פְנֵי דָל וְלֹא תֶהְדַּר פְּנֵי גָדוֹל"`,
                verse2: `"לֹא תַעֲשׂוּ עָוֶל בַּמִּשְׁפָּט בַּמִּדָּה בַּמִּשְׁקָל וּבַמְּשׂוּרָה"`,
                options: [
                    { text: "חובה לקנות מוצרים בשוק בלבד", correct: false },
                    { text: "צדק, שוויון ויושר במשפט ובמסחר", correct: true },
                    { text: "זהירות בשימוש במאזניים כבדים", correct: false },
                    { text: "עזרה לעניים בלבד במשפט", correct: false }
                ],
                explanation: "חוקים אלו דורשים הקפדה על צדק מוחלט ושופט ללא משוא פנים (ללא העדפת עשיר או עני), לצד הוגנות מלאה במסחר."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        const floatClasses = ['float-card-1', 'float-card-2', 'float-card-3', 'float-card-4'];

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question-tracker').innerText = `שאלה ${currentQuestionIndex + 1} מתוך ${questions.length}`;
            document.getElementById('verse-1').innerText = q.verse1;
            document.getElementById('verse-2').innerText = q.verse2;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                const animationClass = floatClasses[idx % floatClasses.length];
                
                btn.className = `touch-card ${animationClass} bg-slate-900/90 hover:bg-teal-950 border-3 border-teal-700/60 hover:border-amber-400 p-6 rounded-2xl text-2xl md:text-3xl font-bold text-slate-100 flex items-center justify-start text-right shadow-xl cursor-pointer backdrop-blur`;
                btn.innerHTML = `
                    <span class="w-12 h-12 bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 font-black rounded-xl flex items-center justify-center ml-4 text-2xl flex-shrink-0 shadow-md">
                        ${idx + 1}
                    </span>
                    <span>${opt.text}</span>
                `;
                btn.onclick = () => handleAnswer(opt.correct);
                container.appendChild(btn);
            });
        }

        function triggerConfetti() {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#facc15'];

            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 95 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = (Math.random() * 1.2) + 's';
                confetti.style.transform = `scale(${Math.random() * 0.8 + 0.6})`;
                container.appendChild(confetti);
            }
        }

        function handleAnswer(isCorrect) {
            const overlay = document.getElementById('feedback-overlay');
            const title = document.getElementById('feedback-title');
            const desc = document.getElementById('feedback-desc');
            const icon = document.getElementById('feedback-icon');
            const retryBtn = document.getElementById('retry-btn');
            const nextBtn = document.getElementById('next-btn');

            if (isCorrect) {
                score += 100;
                document.getElementById('score-display').innerText = score;
                triggerConfetti();

                icon.innerText = "🌟";
                title.innerText = "כל הכבוד! תשובה נכונה!";
                title.className = "text-6xl font-black mb-6 text-emerald-400 animate-bounce";
                desc.innerText = questions[currentQuestionIndex].explanation;
                retryBtn.classList.add('hidden');
                nextBtn.classList.remove('hidden');
            } else {
                icon.innerText = "🔍";
                title.innerText = "נסו שוב...";
                title.className = "text-6xl font-black mb-6 text-rose-400";
                desc.innerText = "קראו שוב את שני החוקים שעל הקיר וחשבו איזה ערך משותף לשניהם.";
                retryBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
            }

            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function retryQuestion() {
            const overlay = document.getElementById('feedback-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function nextQuestion() {
            const overlay = document.getElementById('feedback-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');

            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('complete-screen').classList.remove('hidden');
                document.getElementById('complete-screen').classList.add('flex');
                triggerConfetti();
            }
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('score-display').innerText = score;
            document.getElementById('complete-screen').classList.add('hidden');
            document.getElementById('complete-screen').classList.remove('flex');
            loadQuestion();
        }

        // Initialize game on window load
        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
